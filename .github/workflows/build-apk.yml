name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle with Advanced Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (Parallel & Cached)
        run: ./gradlew assembleDebug --no-daemon --parallel --build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxyVPN-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Foxy VPN v1.0.0 (Debug APK)"
          body: |
            ### 🦊 Foxy VPN - Bản cài đặt thử nghiệm (Debug APK)
            - **Phiên bản:** 1.0.0
            - **Công nghệ:** Kotlin + Jetpack Compose (Material3)
            - **Tính năng mới:** Giao diện Splash chuẩn SVG, tự động co giãn kích thước theo từng dòng máy (Responsive Density).
            
            👉 Tải trực tiếp file `app-debug.apk` bên dưới về điện thoại Android để cài đặt.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
