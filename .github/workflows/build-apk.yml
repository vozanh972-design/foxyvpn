name: Build Free Fire VPN APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle with Advanced Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon --parallel --build-cache

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire-VPN-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeFire-VPN-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Free Fire VPN v1.0.${{ github.run_number }}"
          body: |
            ### 🔥 Free Fire VPN - Bản cài đặt mới nhất

            **Tính năng:**
            - 🎮 Tự động mở game Free Fire sau khi kết nối VPN
            - 🌐 VPN không cần root (PacketTunnelEngine - TcpFlow + UdpFlow)
            - 🔥 Giao diện logo Free Fire
            - 📱 Chip **Auto** → bấm vào → mở thẳng game Free Fire
            - 🛡️ Tunnel toàn bộ traffic qua VPN trước khi vào game

            👉 Tải `app-release.apk` để cài đặt.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
