name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle with Advanced Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release & Debug APKs (Parallel & Optimized)
        run: ./gradlew assembleRelease assembleDebug --no-daemon --parallel --build-cache

      - name: Upload Optimized Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxyVPN-Release-Optimized-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FoxyVPN-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Foxy VPN v1.0.0 (Release Optimized)"
          body: |
            ### 🦊 Foxy VPN - Bản cài đặt tối ưu hóa (Release APK)
            - **Phiên bản:** 1.0.0
            - **Công nghệ:** Kotlin + Jetpack Compose (Material3)
            - **Tối ưu hóa:** Đã bật R8 Code Minification và Resource Shrinking giúp app chạy cực nhẹ, tiết kiệm RAM/Pin.
            - **Tính năng mới:**
              - Logo Foxy trước tên thương hiệu trên màn nhập Key.
              - Chữ ký thiết bị vĩnh viễn (Lifetime Hardware Signature) chống ghi đè, dùng suốt đời.
              - Tự động co giãn theo mọi kích cỡ màn hình (Responsive Density).
            
            👉 **Khuyên dùng:** Tải file `app-release.apk` bên dưới để cài đặt bản tối ưu siêu nhẹ.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
